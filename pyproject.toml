[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "temporal-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "chromadb",
    "sentence-transformers",
    "spacy",
    "pymupdf",
    "pdfplumber",
    "httpx",
    "beautifulsoup4",
    "langchain",
    "prefect",
    "duckdb",
    "neo4j",
    "openai",
    "transformers",
    "torch",
    "pytest",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
